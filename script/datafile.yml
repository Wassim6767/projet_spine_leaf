routers:
  lf1:
    loopback: 10.0.1.1/32
    interfaces:
      - { name: eth1, ip: 10.1.1.1/31, to: sp1 }
      - { name: eth2, ip: 10.1.2.1/31, to: sp2 }
  lf2:
    loopback: 10.0.1.2/32
    interfaces:
      - { name: eth1, ip: 10.1.1.3/31, to: sp1 }
      - { name: eth2, ip: 10.1.2.3/31, to: sp2 }
  lf3:
    loopback: 10.0.1.3/32
    interfaces:
      - { name: eth1, ip: 10.1.1.5/31, to: sp1 }
      - { name: eth2, ip: 10.1.2.5/31, to: sp2 }
  lf4:
    loopback: 10.0.1.4/32
    interfaces:
      - { name: eth1, ip: 10.1.1.7/31, to: sp1 }
      - { name: eth2, ip: 10.1.2.7/31, to: sp2 }
  sp1:
    loopback: 10.0.0.1/32
    interfaces:
      - { name: eth1, ip: 10.1.1.0/31, to: lf1 }
      - { name: eth2, ip: 10.1.1.2/31, to: lf2 }
      - { name: eth3, ip: 10.1.1.4/31, to: lf3 }
      - { name: eth4, ip: 10.1.1.6/31, to: lf4 }
  sp2:
    loopback: 10.0.0.2/32
    interfaces:
      - { name: eth1, ip: 10.1.2.0/31, to: lf1 }
      - { name: eth2, ip: 10.1.2.2/31, to: lf2 }
      - { name: eth3, ip: 10.1.2.4/31, to: lf3 }
      - { name: eth4, ip: 10.1.2.6/31, to: lf4 }