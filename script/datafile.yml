routers:
  lf1:
    interfaces:
      - { name: eth1, ip: 10.1.1.1/24, to: sp1 }
      - { name: eth2, ip: 10.2.1.1/31, to: sp2 }
  lf2:
    loopback: 10.255.0.2/32
    interfaces:
      - { name: eth1, ip: 10.1.2.1/31, to: sp1 }
      - { name: eth2, ip: 10.2.2.1/31, to: sp2 }
  lf3:
    loopback: 10.255.0.3/32
    interfaces:
      - { name: eth1, ip: 10.1.3.1/31, to: sp1 }
      - { name: eth2, ip: 10.2.3.1/31, to: sp2 }
  lf4:
    loopback: 10.255.0.4/32
    interfaces:
      - { name: eth1, ip: 10.1.4.1/31, to: sp1 }
      - { name: eth2, ip: 10.2.4.1/31, to: sp2 }
  sp1:
    loopback: 10.255.0.11/32
    interfaces:
      - { name: eth1, ip: 10.1.1.0/31, to: lf1 }
      - { name: eth2, ip: 10.1.2.0/31, to: lf2 }
      - { name: eth3, ip: 10.1.3.0/31, to: lf3 }
      - { name: eth4, ip: 10.1.4.0/31, to: lf4 }
  sp2:
    loopback: 10.255.0.12/32
    interfaces:
      - { name: eth1, ip: 10.2.1.0/31, to: lf1 }
      - { name: eth2, ip: 10.2.2.0/31, to: lf2 }
      - { name: eth3, ip: 10.2.3.0/31, to: lf3 }
      - { name: eth4, ip: 10.2.4.0/31, to: lf4 }