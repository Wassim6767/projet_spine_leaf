name: spine_leaf
topology:
  kinds:
    linux:
      image: frr-lab:10.7.0
  nodes:
    lf1:
      kind: linux
      binds: 
      - cnfgs/cnfgs_lf:/etc/frr/daemons
      - cnfgs/lf1/frr.conf:/etc/frr/frr.conf
      - cnfgs/vtysh.conf:/etc/frr/vtysh.conf
    lf2: 
      kind: linux
      binds: 
      - cnfgs/cnfgs_lf:/etc/frr/daemons
      - cnfgs/lf2/frr.conf:/etc/frr/frr.conf
      - cnfgs/vtysh.conf:/etc/frr/vtysh.conf
    lf3: 
      kind: linux
      binds: 
      - cnfgs/cnfgs_lf:/etc/frr/daemons
      - cnfgs/lf3/frr.conf:/etc/frr/frr.conf
      - cnfgs/vtysh.conf:/etc/frr/vtysh.conf
    lf4: 
      kind: linux
      binds: 
      - cnfgs/cnfgs_lf:/etc/frr/daemons
      - cnfgs/lf4/frr.conf:/etc/frr/frr.conf
      - cnfgs/vtysh.conf:/etc/frr/vtysh.conf
    sp1: 
      kind: linux
      binds: 
      - cnfgs/cnfgs_sp:/etc/frr/daemons
      - cnfgs/sp1/frr.conf:/etc/frr/frr.conf
      - cnfgs/vtysh.conf:/etc/frr/vtysh.conf
    sp2: 
      kind: linux
      binds: 
      - cnfgs/cnfgs_sp:/etc/frr/daemons
      - cnfgs/sp2/frr.conf:/etc/frr/frr.conf
      - cnfgs/vtysh.conf:/etc/frr/vtysh.conf
  links:
    - type: veth
      endpoints:
        - node: lf1
          interface: eth1
        - node: sp1
          interface: eth1
    - type: veth
      endpoints:
        - node: lf2
          interface: eth1
        - node: sp1
          interface: eth2
    - type: veth
      endpoints:
        - node: lf3
          interface: eth1
        - node: sp1
          interface: eth3
    - type: veth
      endpoints:
        - node: lf4
          interface: eth1
        - node: sp1
          interface: eth4
    - type: veth
      endpoints:
        - node: lf1
          interface: eth2
        - node: sp2
          interface: eth1
    - type: veth
      endpoints:
        - node: lf2
          interface: eth2
        - node: sp2
          interface: eth2
    - type: veth
      endpoints:
        - node: lf3
          interface: eth2
        - node: sp2
          interface: eth3
    - type: veth
      endpoints:
        - node: lf4
          interface: eth2
        - node: sp2
          interface: eth4
        