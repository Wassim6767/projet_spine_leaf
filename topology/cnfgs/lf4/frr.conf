frr defaults datacenter
hostname lf4
!
interface lo
 ip address 10.0.1.4/32
!
interface eth1
 description to sp1
 ip address 10.1.1.7/31
 no shutdown
!
interface eth2
 description to sp2
 ip address 10.1.2.7/31
 no shutdown
!
router bgp 65104
 bgp router-id 10.0.1.4
 no bgp ebgp-requires-policy
 neighbor 10.1.1.6 remote-as 65000
 neighbor 10.1.1.6 update-source lo
 neighbor 10.1.2.6 remote-as 65000
 neighbor 10.1.2.6 update-source lo
 !
 address-family ipv4 unicast
  network 10.0.1.4/32
 exit-address-family
!
wr
!