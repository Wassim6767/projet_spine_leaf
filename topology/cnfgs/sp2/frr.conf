frr version 10.7.1_git
frr defaults datacenter
hostname sp2
service integrated-vtysh-config
!
interface eth1
 description to lf1
 ip address 10.1.2.0/31
exit
!
interface eth2
 description to lf2
 ip address 10.1.2.2/31
exit
!
interface eth3
 description to lf3
 ip address 10.1.2.4/31
exit
!
interface eth4
 description to lf4
 ip address 10.1.2.6/31
exit
!
interface lo
 ip address 10.0.0.2/32
exit
!
router bgp 65000
 neighbor 10.1.2.1 remote-as 65101
 neighbor 10.1.2.3 remote-as 65102
 neighbor 10.1.2.5 remote-as 65103
 neighbor 10.1.2.7 remote-as 65104
 use-underlays-nexthop-weight
exit
!
router pim
 no autorp discovery
exit
!
