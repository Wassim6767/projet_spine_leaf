frr version 10.7.1_git
frr defaults datacenter
hostname sp1
service integrated-vtysh-config
!
interface eth1
 description to lf1
 ip address 10.1.1.0/31
exit
!
interface eth2
 description to lf2
 ip address 10.1.1.2/31
exit
!
interface eth3
 description to lf3
 ip address 10.1.1.4/31
exit
!
interface eth4
 description to lf4
 ip address 10.1.1.6/31
exit
!
interface lo
 ip address 10.0.0.1/32
exit
!
router bgp 65000
 neighbor 10.1.1.1 remote-as 65101
 neighbor 10.1.1.1 update-source lo0
 neighbor 10.1.1.3 remote-as 65102
 neighbor 10.1.1.3 update-source lo0
 neighbor 10.1.1.5 remote-as 65103
 neighbor 10.1.1.5 update-source lo0
 neighbor 10.1.1.7 remote-as 65104
 neighbor 10.1.1.7 update-source lo0
 use-underlays-nexthop-weight
exit
!
router pim
 no autorp discovery
exit
!
